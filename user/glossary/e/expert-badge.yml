_schema: default
glossary_term_name: Expert Badge
term_description: >-
  A downloadable image showing your tier in the CloudCannon Partner Program, which you can display on your own website to show your CloudCannon expertise. *Expert Badges* are available from the Silver tier up, and you can download yours as an SVG file from the *Partner Rewards* page in your *Partner Organization*. Each badge reflects your current tier, so the badge you download changes as you earn *Partner Points* and move up the tiers.
documentation_link: /documentation/partner-articles/what-are-partner-points-and-rewards/
