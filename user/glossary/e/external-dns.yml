_schema: default
glossary_term_name: External DNS
term_description: >-
  Domain Name System configuration managed by a third-party DNS provider rather than CloudCannon DNS. External DNS allows you to host your *Site* on CloudCannon but manage your DNS records elsewhere, such as with Cloudflare or on your own servers. You add the DNS records CloudCannon lists for each *Subdomain* at your DNS provider.
documentation_link: /documentation/developer-articles/configure-external-dns/
