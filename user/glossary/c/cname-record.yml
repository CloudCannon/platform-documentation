_schema: default
glossary_term_name: CNAME Record
term_description: >-
  A Canonical Name (CNAME) record, a type of DNS Record that makes one domain name an alias of another, so a DNS lookup for the alias returns the other name's IP address. A CNAME Record doesn't redirect visitors, and their browser keeps showing the alias. In CloudCannon, when your domain uses external DNS, each *Subdomain* other than your *Base Domain* uses a CNAME Record that points at CloudCannon.
documentation_link: /documentation/developer-articles/what-is-dns/
