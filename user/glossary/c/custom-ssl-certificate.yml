_schema: default
glossary_term_name: Custom SSL Certificate
term_description: >-
  An *SSL Certificate* you obtain from a trusted third-party service (e.g., GoDaddy, Google, AWS, Cloudflare) and add to CloudCannon. Use one if you already have an *SSL Certificate*, or if your company's security policies require a certificate from an approved authority.
documentation_link: /documentation/developer-articles/add-a-custom-ssl-certificate/
