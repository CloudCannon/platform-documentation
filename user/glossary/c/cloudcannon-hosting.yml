_schema: default
glossary_term_name: CloudCannon Hosting
term_description: >-
  The default hosting option for a *Subdomain* on your *Custom Domain*. Visitors reach CloudCannon through Cloudflare's global network. Cloudflare stores copies of your *Site's* files in data centers around the world and serves each visitor from the one nearest them. The *Subdomain's* DNS Record points at `sites.cloudcannon.com`.
documentation_link: /documentation/developer-articles/what-are-the-hosting-options-for-a-subdomain/
