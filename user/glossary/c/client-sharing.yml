_schema: default
glossary_term_name: Client Sharing
term_description: >-
  A CloudCannon feature that allows you to invite someone from outside your *Organization* to view, edit, and publish content for a specific *Site*. Unlike *Site Sharing*, clients invited through *Client Sharing* do not need a CloudCannon account. Instead, they log in using a site-specific password through a dedicated *Client Login Page*. Each *Site* with *Client Sharing* enabled counts as one *Team Member* for billing, regardless of how many *Clients* use its password.
documentation_link: /documentation/user-articles/what-is-client-sharing/
