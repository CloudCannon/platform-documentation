glossary_term_name: Card
term_description: >-
  The repeated block CloudCannon uses to represent one item in a list, browser, or input, typically showing a preview image, title, subtitle, icon, and key metadata. *Cards* represent files and folders in the *Collection Browser* and *File Browser*, as well as *Sites*, *Organizations*, *Team Members*, domains, health checks, and items inside *Array* and *Object Inputs*. You can configure how *Cards* look for your files, making it easier to browse and identify content at a glance.
