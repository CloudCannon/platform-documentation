_schema: default
glossary_term_name: Cloudflare Proxy
term_description: >-
  A hosting option for a subdomain on your *Custom Domain*, where your own Cloudflare account proxies the subdomain to CloudCannon. The subdomain's record in your Cloudflare zone has the proxy turned on and points at `orange-cloud.cloudcannon.com`. Choose it if you manage your DNS in Cloudflare with the proxy turned on.
documentation_link: /documentation/developer-articles/how-does-hosting-work-on-cloudcannon/
