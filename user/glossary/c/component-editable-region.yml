_schema: default
glossary_term_name: Component Editable Region
term_description: >-
  A designated area within a webpage that wraps a component, include, or partial so team members can change its values in CloudCannon's *Visual Editor* and see it re-render in place. Unlike the other *Editable Region* types, *Component Editable Regions* need an integration installed for your static site generator.
documentation_link: /documentation/developer-articles/configure-component-editable-regions/
