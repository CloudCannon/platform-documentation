glossary_term_name: Client Organization
term_description: >-
  A separate *Organization* that a *Partner Organization* manages but that the client uses and pays for. *Client Organizations* are part of the CloudCannon Partner Program and give each client their own team, billing, and login. Unlike *Client Sharing*, which shares a single *Site* with someone who doesn't have a CloudCannon account, a *Client Organization* is a full, independent *Organization*.
documentation_link: /documentation/partner-articles/create-a-client-organization/
