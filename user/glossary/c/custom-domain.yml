_schema: default
glossary_term_name: Custom Domain
term_description: >-
  A domain you own and connect to your CloudCannon *Organization*, so visitors reach your *Site* at your own address instead of its *Testing Domain*. You buy the domain from a domain registrar, connect it to your *Organization*, then add it to your *Sites*.
documentation_link: /documentation/developer-articles/what-is-a-custom-domain/
