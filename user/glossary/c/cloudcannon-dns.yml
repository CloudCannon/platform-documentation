_schema: default
glossary_term_name: CloudCannon DNS
term_description: >-
  A DNS provider option where CloudCannon manages the DNS records of your *Custom Domain*. CloudCannon adds the records each *Subdomain* needs, and the TXT records for your certificates, for you. To use it, you replace the nameservers at your domain registrar with CloudCannon's nameservers.
documentation_link: /documentation/developer-articles/configure-cloudcannon-dns/
