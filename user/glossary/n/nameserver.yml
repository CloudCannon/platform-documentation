_schema: default
glossary_term_name: Nameserver
term_description: >-
  A server involved in the DNS lookup process. The word "nameserver" typically refers to the authoritative nameserver, which manages all the DNS records for a particular domain name. Almost all domains rely on multiple authoritative nameservers for redundancy. To use CloudCannon DNS, you set CloudCannon's nameservers at your domain registrar.
documentation_link: /documentation/developer-articles/what-is-dns/
