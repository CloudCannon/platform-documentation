_schema: default
glossary_term_name: Inbox
term_description: >-
  The page on your *Site* where CloudCannon collects and displays form submissions, allowing you to view, manage, and export form data submitted by website visitors. You can access each *Inbox* from the *Inboxes* link in your *Site Navigation*. Each *Inbox* accepts 2250 submissions per 30-day period, and you can have multiple *Inboxes* on your *Site* depending on your *Subscription Plan*.
documentation_link: /documentation/developer-articles/create-an-inbox/
