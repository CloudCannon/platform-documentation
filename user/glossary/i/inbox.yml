_schema: default
glossary_term_name: Inbox
term_description: >-
  A collection of the form submissions visitors send through your *Sites*, which CloudCannon stores for you. An *Inbox* belongs to your *Organization* rather than to one *Site*, so you manage it from the *Forms* page under *Org Settings* and link it to the *Sites* whose forms submit to it. Each *Inbox* accepts 2250 submissions per 30-day period by default, and how many *Inboxes* you can link to a *Site* depends on your *Subscription Plan*.
documentation_link: /documentation/developer-articles/what-is-an-inbox/
