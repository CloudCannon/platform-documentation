glossary_term_name: Inbox Target
term_description: >-
  A destination an *Inbox* forwards a copy of each form submission to, such as an email address, a Slack channel, or a webhook for an external service. Each target has a *Type*, which decides what the *Target* field expects. An *Inbox* keeps storing every submission it receives whether it has targets or not, and how many targets it can carry depends on your *Subscription Plan*.
documentation_link: /documentation/developer-articles/what-is-an-inbox-target/
