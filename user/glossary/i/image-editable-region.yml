_schema: default
glossary_term_name: Image Editable Region
term_description: >-
  A designated area within a webpage where *Organization Members* can change an image in CloudCannon's *Visual Editor*. *Image Editable Regions* allow you to upload images from your local storage, select existing images from your repository or DAM, and manage image details like title or alt text.
documentation_link: /documentation/developer-articles/configure-image-editable-regions/
