_schema: default
glossary_term_name: Wildcard SSL Certificate
term_description: >-
  An *SSL Certificate* that covers every subdomain of your *Base Domain* you haven't set up on CloudCannon (e.g., \*.example.com). It lets visitors to those subdomains reach your *Fallback Redirect* over HTTPS. On external DNS, the wildcard *SSL Certificate* needs new TXT records at your *DNS Provider* each time it renews, unless you add a CNAME record that lets Cloudflare renew it on its own.
documentation_link: /documentation/developer-articles/add-an-auto-generated-ssl-certificate/
