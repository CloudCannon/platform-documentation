_schema: default
glossary_term_name: Single Origin
term_description: >-
  A hosting option for a *Subdomain* on your *Custom Domain*, where DNS points straight at CloudCannon's origin servers, or your own proxy sits in front of them. Visitors skip CloudCannon's Cloudflare network and its cache. CloudCannon doesn't recommend it unless you have specific setup requirements.
documentation_link: /documentation/developer-articles/how-does-hosting-work-on-cloudcannon/
