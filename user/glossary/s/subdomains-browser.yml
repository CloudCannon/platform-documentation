_schema: default
glossary_term_name: Subdomains Browser
term_description: >-
  The list of *Subdomains* on the *Subdomains* tab of the *Domain page* for a *Custom Domain*. The *Subdomains Browser* shows the hosting, HTTPS, and DNS status of each *Subdomain*, and allows you to sort and filter them and open the *Subdomain page* for each one.
documentation_link: /documentation/user-articles/what-is-the-domain-page/#the-subdomains-tab
