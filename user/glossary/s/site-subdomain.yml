_schema: default
glossary_term_name: Site Subdomain
term_description: >-
  A *Subdomain* on your *Custom Domain* with the *Site* *Subdomain Type*, which serves one or more *Sites*, each at its own subpath. It counts toward your *Subscription Plan* once it serves a *Site*, and shows visitors a 404 page until then. You can select the *Site* type in the *Add a Subdomain* modal, or with the *Change type to Site* option in the *Context Menu* for the *Subdomain* on the *Subdomains* tab of the *Domain page*, which lists each *Site Subdomain* with the *Sites* it serves.
documentation_link: /documentation/developer-articles/what-is-a-subdomain/#site-subdomains
