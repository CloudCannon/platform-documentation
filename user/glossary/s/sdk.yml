_schema: default
glossary_term_name: SDK
term_description: >-
  A typed client library for the CloudCannon API that handles authentication and
  request signing, letting programs read and change content in your *Organization*
  without a person logging in through a browser. The CloudCannon SDK (Software
  Development Kit) authenticates with an *Access Key* or an *API Key*, and the
  CloudCannon CLI is built on top of it.
documentation_link: /documentation/developer-reference/sdk/
