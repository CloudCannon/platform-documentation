_schema: default
glossary_term_name: Scope
term_description: >-
  The breadth of a CloudCannon *Organization* that a permission applies to. Each
  permission in a *Permission Group* has a scope, which can be Global, *Project*,
  *Site*, *Group*, or *Base Domain*. *Default Permission Groups* use a Global or
  *Site* scope, while *Custom Permission Groups* can set any of the five levels.
documentation_link: /documentation/user-articles/what-are-permission-groups/
