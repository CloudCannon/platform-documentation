_schema: default
glossary_term_name: Subdomain Type
term_description: >-
  The setting that decides what a *Subdomain* on your *Custom Domain* does. A *Site Subdomain* serves one or more *Sites*, each at its own subpath, and a *Redirect Subdomain* sends every visitor to another domain. You can select the *Type* in the *Add a Subdomain* modal, and you can switch it later with the *Change type to Site* or *Change type to Redirect* option in the *Context Menu* for the *Subdomain* on the *Subdomains* tab of the *Domain page*.
documentation_link: /documentation/developer-articles/what-is-a-subdomain/#subdomain-types
