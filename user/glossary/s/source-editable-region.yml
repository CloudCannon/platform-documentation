_schema: default
glossary_term_name: Source Editable Region
term_description: >-
  A designated area within a webpage where team members can edit rich text stored in HTML, using CloudCannon's *Visual Editor*. Unlike a *Text Editable Region*, which reads its value from structured data or front matter, a *Source Editable Region* edits the HTML content in place.
documentation_link: /documentation/developer-articles/configure-source-editable-regions/
