_schema: default
glossary_term_name: Seat
term_description: >-
  A unit of paid capacity in a *Subscription Plan*, consumed by each way of reaching an *Organization's* content. Inviting a *Team Member*, sharing a *Site* through *Site Sharing*, and turning on *Client Sharing* for a *Site* each use one *Seat*. Members of a *Partner Organization* don't use a *Seat* in the *Client Organizations* they manage.
documentation_link: /documentation/user-articles/what-is-a-subscription-plan/
