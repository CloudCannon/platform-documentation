_schema: default
glossary_term_name: Seat
term_description: >-
  The unit of paid capacity in your *Organization's* *Subscription Plan*. Every *Organization Member* you invite uses one *Seat*, as does every person you add through *Site Sharing*, and each *Site* with *Guest Access* enabled uses one *Seat* however many *Guests* share its *Guest Password*. Members of a *Partner Organization* working inside a *Client Organization* do not use a *Seat*.
documentation_link: /documentation/user-articles/what-are-add-ons-and-overages/
