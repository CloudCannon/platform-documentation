_schema: default
glossary_term_name: Subscription Plan
term_description: >-
  The set of features, resource limits, and billing period available to an
  *Organization* in CloudCannon, billed monthly or annually. Each *Organization*
  has one *Subscription Plan* and can upgrade, downgrade, or cancel it at any
  time. Members of the *Owners* or *Billing* *Permission Groups* can manage it
  under *Org Settings*.
documentation_link: /documentation/user-articles/what-is-a-subscription-plan/
