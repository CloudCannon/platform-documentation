_schema: default
glossary_term_name: Subscription Plan
term_description: >-
  A set of features available to your Organization, the monthly usage limits for resources, and the price you pay for access to those features and resources, monthly or annually. Each *Organization* in CloudCannon can have one *Subscription Plan*, and can update or cancel at any time.
documentation_link: /documentation/user-articles/what-is-a-subscription-plan/
