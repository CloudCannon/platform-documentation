_schema: default
glossary_term_name: SSL certificate
term_description: >-
  A digital certificate that proves your website's identity and lets visitors connect to it over HTTPS. On CloudCannon, each *Subdomain* of your *Custom Domain* has its own certificate, which covers every *Site* on that *Subdomain*. A certificate can be auto-generated by CloudCannon or a custom certificate you upload.
documentation_link: /documentation/developer-articles/what-is-an-ssl-certificate/
