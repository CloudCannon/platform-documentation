_schema: default
glossary_term_name: SSL Certificate
term_description: >-
  A digital certificate that proves your website's identity and lets visitors connect to it over HTTPS. On CloudCannon, each *Subdomain* of your *Custom Domain* has its own *SSL Certificate*, which covers every *Site* on that *Subdomain*. An *SSL Certificate* can be auto-generated by CloudCannon, or a *Custom SSL Certificate* you upload.
documentation_link: /documentation/developer-articles/what-is-an-ssl-certificate/
