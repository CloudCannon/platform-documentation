_schema: default
glossary_term_name: Subscription
term_description: >-
  The ongoing payment to CloudCannon for your *Organization's* *Subscription Plan*.
  A *Subscription* can be active, paused, or canceled. Canceling a *Subscription* 
  will prevent you from  paying for further use of features and resources
  without deleting the *Organization*, its *Sites*, or files.
documentation_link: /documentation/user-articles/introduction-to-billing/
