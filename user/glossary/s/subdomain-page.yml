_schema: default
glossary_term_name: Subdomain page
term_description: >-
  The page for one *Subdomain* on your *Custom Domain*, opened from the *Subdomains* tab of the *Domain page*. It shows the *Sites* the *Subdomain* serves or where it redirects, and has *Hosting*, *HTTPS*, and *DNS* sections where you change its settings.
documentation_link: /documentation/user-articles/what-is-the-subdomain-page/
