_schema: default
glossary_term_name: Subdomain
term_description: >-
  An additional name on the front of your URL, prefixing your *Base Domain* name (e.g., "docs" in docs.example.com or "blog" in blog.example.com). In CloudCannon, every address on your *Custom Domain*, including the *Base Domain* itself, is a *Subdomain* with its own hosting, HTTPS, and DNS settings. Each *Subdomain* serves *Sites*, each at its own path, or redirects visitors to another domain. A *Subdomain* with no *Site* yet sends visitors to your fallback redirect.
documentation_link: /documentation/developer-articles/what-is-a-custom-domain/
