_schema: default
glossary_term_name: Subpath
term_description: >-
  The path at which a *Site* is served on a *Subdomain* (e.g., /docs/ in example.com/docs/). On CloudCannon, several *Sites* can share a *Subdomain*, each at its own subpath, which you set in the *Path (optional)* field when you add a *Custom Domain* to a *Site*. Your build output must put the *Site's* files in a folder that matches the subpath (e.g., docs/).
documentation_link: /documentation/developer-articles/add-a-custom-domain-to-your-site/
