_schema: default
glossary_term_name: DNS Resolver
term_description: >-
  The Domain Name System (DNS) resolver, the server responsible for translating a domain name into an IP address. It is usually maintained by the visitor's Internet service provider, or is a public resolver the visitor chooses. Also known as a recursive resolver or a DNS recursor.
documentation_link: /documentation/developer-articles/what-is-dns/
