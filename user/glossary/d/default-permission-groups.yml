_schema: default
glossary_term_name: Default Permission Groups
term_description: >-
  CloudCannon's pre-configured sets of permissions that define common levels of access like *Owner*, *Developer*, *Technical Editor*, *Editor*, and *Billing*, along with the groups for *Site Sharing*, *Client Sharing*, and the *Partner* group in a *Client Organization*. CloudCannon creates these groups for you and defines what they can do, whichever *Subscription Plan* you are on. Team members who are added to these groups will have the permissions defined by the group.
documentation_link: /documentation/user-articles/what-are-default-permission-groups/
