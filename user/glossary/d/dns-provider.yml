_schema: default
glossary_term_name: DNS Provider
term_description: >-
  The service that stores the DNS records for your *Custom Domain* and answers DNS questions about it. This can be CloudCannon DNS, your domain registrar, or another service such as Cloudflare. You choose the *DNS Provider* when you connect a *Custom Domain*, and you can change it later in *Domain Settings*.
documentation_link: /documentation/developer-articles/what-is-dns/
