_schema: default
glossary_term_name: Domain page
term_description: >-
  The page in CloudCannon where you manage a *Custom Domain* connected to your *Organization*. Its tabs show whether every subdomain is working, list your subdomains and fallback redirect, show your DNS provider and records, and hold the settings of the domain. You can access this page by clicking the *Card* for a domain in the *Domains Browser*.
documentation_link: /documentation/developer-articles/what-is-the-domain-page/
