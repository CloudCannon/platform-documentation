_schema: default
glossary_term_name: Domain Registrar
term_description: >-
  A third-party company that manages the registration and renewal of domain names. Domain registrars allow you to purchase and configure domain names, and they handle the administrative aspects of domain ownership. You must purchase a domain name from a domain registrar before you can connect it to your CloudCannon *Organization* as a *Custom Domain*.
documentation_link: /documentation/developer-articles/what-is-a-custom-domain/
