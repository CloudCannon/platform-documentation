_schema: default
glossary_term_name: Domains Browser
term_description: >-
  The page where you manage the *Custom Domains* connected to your *Organization*. The *Domains Browser* allows you to connect new domains and open the *Domain page* for each one to manage its *Subdomains*, DNS records, *SSL Certificates*, and minimum TLS version. You can access the *Domains Browser* by clicking the *Custom Domains* link in the *App Sidebar*.
documentation_link: /documentation/developer-articles/what-is-a-custom-domain/
