_schema: default
glossary_term_name: TLS
term_description: >-
  Transport Layer Security, the protocol that encrypts the connection between a visitor's browser and your website when they use HTTPS. Newer TLS versions fix known weaknesses in older ones. On CloudCannon, you set a minimum TLS version of 1.2 or 1.3 for each *Custom Domain*.
documentation_link: /documentation/developer-articles/what-is-an-ssl-certificate/
