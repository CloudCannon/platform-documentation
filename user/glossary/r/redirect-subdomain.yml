_schema: default
glossary_term_name: Redirect subdomain
term_description: >-
  A subdomain on your *Custom Domain* that sends every visitor to another domain instead of serving a *Site*, preserving the visitor's path and query string. Each redirect subdomain has its own certificate and status code. Redirect subdomains don't count toward the number of *Custom Domains* in your *Subscription Plan*.
documentation_link: /documentation/developer-articles/manage-redirect-subdomains/
