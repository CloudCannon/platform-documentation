_schema: default
glossary_term_name: Redirect Subdomain
term_description: >-
  A *Subdomain* on your *Custom Domain* with the *Redirect* *Subdomain Type*, which sends every visitor to another domain instead of serving a *Site*, preserving the visitor's path and query string. Each *Redirect Subdomain* has its own *SSL Certificate* and status code, and doesn't count toward your *Subscription Plan*. You can select the *Redirect* type in the *Add a Subdomain* modal, or with the *Change type to Redirect* option in the *Context Menu* for the *Subdomain* on the *Subdomains* tab of the *Domain page*, which lists each *Redirect Subdomain* with the domain it redirects to.
documentation_link: /documentation/developer-articles/manage-your-redirect-subdomains/
