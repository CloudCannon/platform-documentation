_schema: default
glossary_term_name: Guest Password
term_description: >-
  The password that lets someone without a CloudCannon account reach a *Site* with *Guest Access* enabled. Each *Site* has one *Guest Password*, set by anyone who can change that *Site's* settings, and everyone who uses it shares the same identity in CloudCannon. Changing the *Guest Password* stops the old one working for new sign-ins but does not sign out anyone already signed in, so turning off *Guest Access* is the only way to end every guest session.
documentation_link: /documentation/user-articles/what-is-client-sharing/
