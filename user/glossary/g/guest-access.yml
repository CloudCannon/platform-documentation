_schema: default
glossary_term_name: Guest Access
term_description: >-
  A CloudCannon feature that allows you to invite someone from outside your *Organization* to view, edit, and publish content for a specific *Site*. Unlike *Site Sharing*, *Guests* invited through *Guest Access* do not need a CloudCannon account. Instead, they log in using a *Guest Password* through a dedicated *Guest Login Page*. Each *Site* with *Guest Access* enabled uses one *Seat*, regardless of how many *Guests* use its password. The Guest Access feature was previously called Client Sharing.
documentation_link: /documentation/user-articles/what-is-guest-access/
