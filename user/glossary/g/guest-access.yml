_schema: default
glossary_term_name: Guest Access
term_description: >-
  A CloudCannon feature that allows you to give someone outside your *Organization* access to view, edit, and publish content for a specific *Site*. Unlike *Site Sharing*, people invited through *Guest Access* do not need a CloudCannon account. Instead, they log in with a *Guest Password* and see a simplified version of CloudCannon scoped to that *Site*. Each *Site* with *Guest Access* enabled uses one *Seat* on your *Subscription Plan*, regardless of how many people use the password.
documentation_link: /documentation/user-articles/what-is-client-sharing/
