_schema: default
glossary_term_name: Hosted Mode
term_description: >-
  The default *Site Building Mode*, where CloudCannon builds your *Site* and hosts the build output. A *Site* in *Hosted Mode* has a *Testing Domain*, can use the *Visual Editor*, and can be served on a *Custom Domain*. You can select it on the *Details* page under *Site Settings*.
documentation_link: /documentation/developer-articles/what-is-site-building-mode/#hosted-mode
