_schema: default
glossary_term_name: Headless Mode
term_description: >-
  A *Site Building Mode* where CloudCannon doesn't build or host your *Site*, but your team can still edit its files. A *Site* in *Headless Mode* has no *Testing Domain* or *Visual Editor*, and can't be served on a *Custom Domain* through CloudCannon. Switching a *Site* that has built to *Headless Mode* takes it offline. You can select the *Site Building Mode* on the *Details* page under *Site Settings*.
documentation_link: /documentation/developer-articles/what-is-headless-mode/
