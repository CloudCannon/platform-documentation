_schema: default
glossary_term_name: Health Check
term_description: >-
  An automatic check on an *Organization* that flags something you may need to resolve, such as a failed build, a *Custom Domain* that is not resolving, or an expiring SSL certificate. CloudCannon groups your *Health Checks* by severity under *Danger*, *Warning*, *Informational*, and *Passed* on the *Health* tab of your *Organization Home* page. In a *Partner Organization*, the *Health* tab also covers every *Client Organization* you manage.
documentation_link: /documentation/partner-articles/manage-your-client-organizations/
