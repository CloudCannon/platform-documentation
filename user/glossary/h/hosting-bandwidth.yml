_schema: default
glossary_term_name: Hosting Bandwidth
term_description: >-
  The amount of data transferred from your hosted *Site* to visitors' browsers,
  determined by visitor count and webpage size. Each *Subscription Plan* includes a set
  amount, and you can enable *Overages* to keep your *Sites* live if you go over this amount. You can review your usage under the *Usage* tab of your *Site
  Dashboard* or *Organization Home* page.
documentation_link: /documentation/user-articles/what-is-hosting-bandwidth/
