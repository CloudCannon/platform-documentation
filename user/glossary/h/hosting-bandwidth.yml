glossary_term_name: Hosting Bandwidth
term_description: >-
  The amount of data transferred from your hosted *Site* to visitors' browsers,
  determined by visitor count and webpage size. Each pricing plan includes a set
  amount, and you can enable *Overages* or purchase additional bandwidth if you
  need more. You can review your usage under the *Usage* tab of your *Site
  Dashboard* or *Organization Home* page.
