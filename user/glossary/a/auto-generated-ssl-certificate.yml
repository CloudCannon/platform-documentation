_schema: default
glossary_term_name: Auto-generated SSL certificate
term_description: >-
  A free SSL certificate that CloudCannon issues and renews for each *Subdomain* you host on CloudCannon. CloudCannon issues these certificates through ZeroSSL and Cloudflare. It is the default for every *Subdomain* unless you upload a custom SSL certificate.
documentation_link: /documentation/developer-articles/add-an-auto-generated-ssl-certificate/
