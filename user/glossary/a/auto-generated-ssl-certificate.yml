_schema: default
glossary_term_name: Auto-generated SSL Certificate
term_description: >-
  A free *SSL Certificate* that CloudCannon issues and renews for each *Subdomain* you host on CloudCannon. It is the default for every *Subdomain* unless you upload a *Custom SSL Certificate*.
documentation_link: /documentation/developer-articles/add-an-auto-generated-ssl-certificate/
