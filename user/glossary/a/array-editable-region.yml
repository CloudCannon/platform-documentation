_schema: default
glossary_term_name: Array Editable Region
term_description: >-
  A designated area within a webpage where *Organization Members* can add, remove, and reorder array values in CloudCannon's *Visual Editor*. *Array Editable Regions* work with arrays stored in structured data or front matter that populate templating in your layout files, and support editing array components and page building.
documentation_link: /documentation/developer-articles/configure-array-editable-regions/
