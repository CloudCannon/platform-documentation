_schema: default
glossary_term_name: A Record
term_description: >-
  An Address (A) record, a type of DNS record that specifies the IP address for a given domain name in IPv4 format. In CloudCannon, when your domain uses external DNS, your *Base Domain* on *CloudCannon Hosting* or *Single Origin* uses two A records that point at CloudCannon.
documentation_link: /documentation/developer-articles/what-is-dns/
