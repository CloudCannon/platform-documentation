_schema: default
glossary_term_name: Array Item Editable Region
term_description: >-
  A designated area marking a single item inside an *Array Editable Region*, which team members can move or remove in CloudCannon's *Visual Editor*. Each *Array Item Editable Region* must sit within an *Array Editable Region*, and can contain nested *Editable Regions* for editing the content of that item.
documentation_link: /documentation/developer-articles/configure-array-editable-regions/
