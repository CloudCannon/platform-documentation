_schema: default
glossary_term_name: Access Review
term_description: >-
  A CSV file listing everyone with access to your *Organization*, including how
  each *Team Member* signs in and when they were last active. Members of the
  *Owners Permission Group*, or the *Partner Permission Group* in a
  *Client Organization*, can export one from the *Members* tab on the *Team*
  page under *Org Settings*.
documentation_link: /documentation/user-articles/what-is-an-access-review/
