_schema: default
glossary_term_name: Add-on
term_description: >-
  Extra capacity (team members, bandwidth, custom domains, or build time) that
  extends a plan's included limits. When overages are enabled, CloudCannon
  automatically adds capacity as your *Organization* exceeds its plan's included
  limits.
documentation_link: /documentation/user-articles/what-are-add-ons-and-overages/
