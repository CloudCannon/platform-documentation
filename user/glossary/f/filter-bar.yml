glossary_term_name: Filter Bar
term_description: >-
  The row of controls above a list or browser, used to narrow what you see. Clicking the *Add Filter* button opens a *Context Menu* where you choose a filter and its value, and each filter you apply stays in the *Filter Bar* as a tag until you remove it. You can also type in the *Filter Bar* to search by keyword.
