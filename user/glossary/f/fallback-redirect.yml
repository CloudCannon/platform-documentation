_schema: default
glossary_term_name: Fallback redirect
term_description: >-
  The subdomain to which CloudCannon sends visitors when they try to visit a subdomain on your *Custom Domain* that isn't set up, or a subdomain with no *Site* yet. It prevents visitors from seeing an error when they mistype a subdomain (e.g., typo.example.com). Each *Custom Domain* has one fallback redirect.
documentation_link: /documentation/developer-articles/update-the-fallback-redirect-for-your-custom-domain/
