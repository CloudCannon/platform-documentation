_schema: default
glossary_term_name: Organization Member
term_description: >-
  A person who belongs to the same *Organization* as you. Organization Members are other CloudCannon users who have been invited to your *Organization* to collaborate on *Sites*, edit content, or manage settings. Each Organization Member has their own CloudCannon account with individual permissions assigned through *Permission Groups*, and uses one *Seat* in your *Subscription Plan*.
documentation_link: /documentation/user-articles/what-is-an-organization-member/
