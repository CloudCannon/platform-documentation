_schema: default
glossary_term_name: Base Domain
term_description: >-
  The primary domain name for a website, without any subdomains. For example, in "www.example.com", the *Base Domain* is "example.com". In CloudCannon, you connect your *Base Domain* to your *Organization* as a *Custom Domain*.
documentation_link: /documentation/developer-articles/connect-a-custom-domain-to-your-organization/
