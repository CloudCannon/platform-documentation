_schema: default
glossary_term_name: Bearer Token
term_description: >-
  An alphanumeric string that lets a trusted application access the protected content of a single *Site* hosted through CloudCannon. The application passes the token in the HTTP `Authorization` header, and CloudCannon serves the protected content in response. You generate a *Bearer Token* on the *Bearer Token* page in your *Site Settings*.
documentation_link: /documentation/developer-articles/generate-a-bearer-token/
