glossary_term_name: Build Time
term_description: >-
  The total time CloudCannon spends building your *Sites*, measured cumulatively
  across all builds in a billing period. Paid plans include unlimited build
  time; on plans with a build time limit, you can enable *Overages* or purchase
  additional build time if you need more. You can review your usage under the
  *Usage* tab of your *Site Dashboard* or *Organization Home* page.
