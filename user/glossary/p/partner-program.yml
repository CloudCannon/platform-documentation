glossary_term_name: Partner Program
term_description: >-
  CloudCannon's program for agencies and freelancers who build and maintain *Sites* for clients. The *Partner Program* gives you a single place to manage many clients, the option to run each client in a separate *Client Organization*, and *Partner Points* that unlock rewards as your client work grows.
documentation_link: /documentation/partner-articles/what-is-the-cloudcannon-partner-program/
