glossary_term_name: Partner Points
term_description: >-
  Points earned in the CloudCannon Partner Program for each active client and the seats they use. CloudCannon can also award additional points for milestones and campaigns. As your points grow, your partnership moves through partner tiers that unlock benefits and a downloadable *Expert Badge*.
documentation_link: /documentation/partner-articles/what-are-partner-points-and-rewards/
