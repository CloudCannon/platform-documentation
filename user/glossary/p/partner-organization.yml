glossary_term_name: Partner Organization
term_description: >-
  A CloudCannon *Organization* that belongs to a member of the *Partner Program* and serves as their base for managing client work. From their *Partner Organization*, *Partners* create and manage *Client Organizations* and track their *Partner Points*.
documentation_link: /documentation/partner-articles/what-is-the-cloudcannon-partner-program/
