_schema: default
glossary_term_name: View as
term_description: >-
  A CloudCannon feature that lets an *Organization* *Owner* load CloudCannon with the exact permission set of another *Team Member*, to preview what that person can see and do. *View as* only changes which resources you can open and edit; it does not sign you in as that *Team Member*, and any changes you make are still logged under your name. It applies to one *Organization* at a time and ends when you leave the *Organization* or log out.
documentation_link: /documentation/user-articles/view-your-organization-as-a-team-member/
