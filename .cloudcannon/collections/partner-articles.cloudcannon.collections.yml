partner_articles:
  path: partner/articles
  icon: article
  url: /partner-articles/[slug]/
  disable_url: false
  documentation:
    url: https://cloudcannon.com/documentation/partner-articles/
    text: Partner Articles
    icon: auto_stories
  description: >-
    Partner Articles are aimed at web agencies in the CloudCannon Partner
    Program who manage Client Organizations, billing, and rewards on behalf of
    their clients. These can be Explanation articles or Instruction articles
    (see: [Diataxis](https://diataxis.fr/)).
  _inputs:
    $:
      type: object
      options:
        subtype: tabbed
      cascade: true
  create:
    path: '{details.title|slugify}.mdx'
  disable_add: false
  disable_add_folder: false
  disable_file_actions: false
  schemas:
    default:
      path: .cloudcannon/schemas/article.mdx
      reorder_inputs: true
      hide_extra_inputs: false
      remove_empty_inputs: false
      remove_extra_inputs: true
      icon: notes
    instructions:
      path: .cloudcannon/schemas/article-instructions.mdx
      reorder_inputs: true
      hide_extra_inputs: false
      remove_empty_inputs: false
      remove_extra_inputs: true
      icon: notes
