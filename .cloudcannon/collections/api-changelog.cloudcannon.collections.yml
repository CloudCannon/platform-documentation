api_changelog:
  path: developer/reference/api/changelog
  glob:
    - "**/*.mdx"
  name: API Changelog
  icon: api
  url: /developer-reference/api/changelog/{date|year}/{date|month}/{date|day}/{title|slugify}/
  disable_url: false
  documentation:
    url: https://cloudcannon.com/documentation/developer-reference/api/changelog/
    text: CloudCannon API Changelog
    icon: auto_stories
  description: >-
    This *Collection* contains the CloudCannon API changelog, which records
    every change to the API's endpoints, fields, and behavior. Each entry has its
    own page and RSS feed item. When an update changes the API, add an entry
    here and link to the API changelog from the main changelog with the standard
    sentence in `STYLE_GUIDE.mdx` §2.1.5.
  sort_options:
    - key: path
      order: descending
  _inputs:
    title:
      type: text
      options:
        required: true
        required_message: Name the change to the API
        min_length: 5
        min_length_message: Tell people a bit more than that
      cascade: true
    $.date:
      type: datetime
      instance_value: NOW
      cascade: true
  create:
    path: '{date|year}/{date|month}-{date|day}_{title|slugify}.[ext]'
    _inputs:
      date:
        type: auto
        instance_value: NOW
        cascade: true
  disable_add: false
  disable_add_folder: false
  disable_file_actions: false
  schemas:
    default:
      path: .cloudcannon/schemas/api-changelog.mdx
      reorder_inputs: true
      hide_extra_inputs: false
      remove_empty_inputs: false
      remove_extra_inputs: true
      icon: api
