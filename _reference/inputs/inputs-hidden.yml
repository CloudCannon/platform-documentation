_schema: default
full_name: _inputs.*.hidden
key_name: hidden
value_type:
  - Boolean
  - String
description: |-
  This key toggles the visibility of an Input in the Data Editor or the sidebar of the Visual or Content Editor. Hidden inputs are useful when you want an Input to exist, but not be visible or editable outside of the Source Editor.

  Value can be a boolean or a string. A boolean value of `true` will hide the Input.

  A string value is an expression, which CloudCannon re-evaluates whenever a value it reads changes. The Input is hidden whenever the expression is truthy.

  * `!published` hides an Input when the sibling Input `published` is falsy
  * `type != "video"` hides an Input unless the sibling Input `type` holds `video`
  * `$.draft` hides an Input when the top-level `draft` value is truthy

  Expressions can also compare values, call functions such as `length` and `starts_with`, and read values elsewhere in the file with `$`, `$parent`, and `this`. For more information, please read our documentation on [hiding or disabling an input with an expression](/documentation/developer-articles/hide-or-disable-an-input-with-an-expression/).

  For an expression beginning with a character YAML reserves, such as `!`, quote the string with `'` or `"`.

  By default, this key is `false`, except for Inputs whose key name begins with an underscore, which CloudCannon hides.
examples: |-
  <comp.Example>
    In this example, we want to hide the `internal_notes` Input from the main interface, but keep it available in the Source Editor.

    <comp.MultiCodeBlock language="YAML" translate_into={["json"]} source="cloudcannon.config.yml">
        ``````````
        _inputs:
          internal_notes:
            type: textarea
            label: Internal Notes
            hidden: true
            comment: Notes for internal use only
        ``````````
        </comp.MultiCodeBlock>

    In this example, we want to conditionally hide the `draft_content` Input based on the `published` status.

    <comp.MultiCodeBlock language="YAML" translate_into={["json"]} source="cloudcannon.config.yml">
        ``````````
        _inputs:
          published:
            type: checkbox
            label: Published
          draft_content:
            type: textarea
            label: Draft Content
            hidden: "!published"
        ``````````
        </comp.MultiCodeBlock>

    In this example, we want to show the `video_path` Input only when the `type` Input holds `video`.

    <comp.MultiCodeBlock language="YAML" translate_into={["json"]} source="cloudcannon.config.yml">
        ``````````
        _inputs:
          type:
            type: select
            options:
              values:
                - video
                - image
          video_path:
            type: url
            label: Video URL
            hidden: type != "video"
        ``````````
        </comp.MultiCodeBlock>
  </comp.Example>
parent_keys:
  - _inputs
child_keys:
