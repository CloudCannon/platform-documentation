_schema: default
full_name: _inputs.*.disabled
key_name: disabled
value_type:
  - Boolean
  - String
description: |-
  This key toggles whether the value of an Input is editable in the Data Editor or the sidebar of the Visual or Content Editor. Disabled inputs are useful if you want CloudCannon to display the Input value, but prevent team members from editing the value outside of the Source Editor.

  Value can be a boolean or a string. A boolean value of `true` will prevent team members from editing the value.

  A string value is an expression, which CloudCannon re-evaluates whenever a value it reads changes. The Input is read-only whenever the expression is truthy.

  * `published` disables an Input when the sibling Input `published` is truthy
  * `!published` disables an Input when the sibling Input `published` is falsy
  * `length(slug) > 0` disables an Input once the sibling Input `slug` holds a value

  Expressions can also compare values, call functions such as `length` and `starts_with`, and read values elsewhere in the file with `$`, `$parent`, and `this`. For more information, please read our documentation on [hiding or disabling an input with an expression](/documentation/developer-articles/hide-or-disable-an-input-with-an-expression/).

  For an expression beginning with a character YAML reserves, such as `!`, quote the string with `'` or `"`.

  By default, this key is `false` (i.e., team members can edit Input values).
examples: |-
  <comp.Example>
    In this example, we have configured the `date_created` Date Input, which will automatically populate when you create a file using this Input. Team members cannot alter this Input as the interface is disabled.

    <comp.MultiCodeBlock language="YAML" translate_into={["json"]} source="cloudcannon.config.yml">
        ``````````
        _inputs:
          date_created:
            type: datetime
            label: Date of article creation
            comment: UTC +0 timezone
            disabled: true
            instance_value: NOW
            options:
              timezone: Etc/UTC
        ``````````
        </comp.MultiCodeBlock>

    In this example, we want to disable the `edit_url` Input when the content is published.

    <comp.MultiCodeBlock language="YAML" translate_into={["json"]} source="cloudcannon.config.yml">
        ``````````
        _inputs:
          published:
            type: checkbox
            label: Published
          edit_url:
            type: url
            label: Edit URL
            disabled: published
        ``````````
        </comp.MultiCodeBlock>

    In this example, we want to lock the `slug` Input once an article has been published to a live URL.

    <comp.MultiCodeBlock language="YAML" translate_into={["json"]} source="cloudcannon.config.yml">
        ``````````
        _inputs:
          slug:
            type: text
            label: URL slug
            disabled: starts_with($.permalink, "https://")
        ``````````
        </comp.MultiCodeBlock>
  </comp.Example>
parent_keys:
  - _inputs
child_keys:
